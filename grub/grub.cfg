# grub/grub.cfg —— SukiOS GRUB 启动菜单
# grub-mkrescue 会据此生成同时兼容 Legacy BIOS 与 UEFI 的 ISO。
set timeout=0
set default=0

# P0-6：显式加载视频驱动，GRUB 才能满足内核 MB2 头的 framebuffer 标签
# （tag5/8）。BIOS 下走 vbe，UEFI 下走 efi_gop（OVMF GOP）；
# all_video 自动挑选可用后端。缺此行时 UEFI 启动无帧缓冲转交（tag8 缺失），
# 内核只能回退 VGA 文本——而 UEFI 根本没有 0xB8000 文本模式，屏幕全黑。
insmod all_video
# 默认显示大小 1280x720（与 configs/display.cfg 默认逻辑分辨率一致）。
# 硬件帧缓冲分辨率由引导器决定；配置文件控制「是否启用视频模式」与
# 「逻辑画布尺寸」。若 QEMU 不支持该模式，GRUB 会回退到可用分辨率。
set gfxpayload=1280x720x32

menuentry "SukiOS (x86_64 hybrid kernel)" {
    multiboot2 /boot/kernel.ski
    # 引导模块：显示服务配置文件（configs/display.cfg）。内核在 fb_init 之前
    # 解析之，决定 video_mode 开关与逻辑分辨率；缺失则保留默认 1280x720 视频模式。
    module2 /boot/display.cfg display.cfg
    boot
}
