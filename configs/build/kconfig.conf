# SukiOS build config (由 tools/kbuild_config.py 生成/维护)

# 内核信息 (Kernel information)
KERNEL_NAME="SukiOS"
KERNEL_VERSION="1.0.0"
KERNEL_CODENAME="Hybrid"
KERNEL_BUILD_INFO="SukiOS hybrid kernel (xnu-like, x86_64)"

# 内核能力 (Kernel capabilities)
CONFIG_CAP_KASLR=y
CONFIG_CAP_PREEMPT=y
CONFIG_CAP_SMEP_SMAP=y
CONFIG_CAP_DEBUGFS=y

# 设备驱动 (Device drivers)
CONFIG_DRIVER_USB=y
CONFIG_DRIVER_HDA=y
CONFIG_DRIVER_AHCI=y
CONFIG_DRIVER_ATA=y
CONFIG_DRIVER_E1000=y
CONFIG_DRIVER_PS2=y
