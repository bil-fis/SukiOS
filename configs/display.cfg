# SukiOS 显示服务配置文件 (display.cfg)
# -----------------------------------------------------------------------------
# 放置位置：仓库 configs/ 目录；构建时由 grub.cfg 经 module2 加载为 /boot/display.cfg，
# 内核在 fb_init 之前解析本文件，据此决定显示模式与逻辑分辨率。
#
# 语法：key = value（允许空格；# 开头为注释；空行忽略；大小写不敏感）
#
# 字段说明：
#   video_mode : on  -> 启用帧缓冲视频模式（图形桌面由 display_server 合成）
#                off -> 禁用帧缓冲，内核回退到 VGA 文本模式（纯文本输出）
#   width      : 显示服务的逻辑画布宽度（像素）。默认 1280。
#                注意：硬件帧缓冲实际分辨率由 QEMU -vga std + GRUB gfxpayload 决定；
#                此值用于显示服务声明/缩放其合成画布，并写入日志以供验证。
#   height     : 显示服务逻辑画布高度（像素）。默认 720。
# -----------------------------------------------------------------------------

video_mode = on
width      = 1280
height     = 720
