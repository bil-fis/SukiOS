# SukiOS Rust 构建配置（提交入库）。
# 目标规格 rust/x86_64-sukios.json 由 `make make-rust-env` 生成（含本仓库绝对路径）。
# 首次使用前请先运行： make make-rust-env
[build]
target = "x86_64-sukios.json"

# 自定义 JSON 目标规格 + 从 rust-src 源码编译 core/alloc（nightly 工具链专属，见 rust-toolchain.toml）。
[unstable]
json-target-spec = true
build-std = ["core", "alloc"]
